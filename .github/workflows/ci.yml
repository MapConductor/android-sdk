name: Android Code Check (Lint + KtLint + ReviewDog)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  code-check:
    runs-on: ubuntu-latest
    name: Lint & ReviewDog on Changed Modules

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Download hash cache
        uses: actions/download-artifact@v4
        with:
          name: lint-hash-cache
          path: .lint-hash-cache
        continue-on-error: true

      - name: Read module list from projects.properties
        id: define
        run: |
          modules=$(grep '^modules=' projects.properties | cut -d= -f2)
          echo "modules=$modules" >> $GITHUB_OUTPUT

      - name: Detect changed modules by hashing src/
        id: detect
        run: |
          changed_modules=""
          mkdir -p .lint-hash-cache
          for module in ${{ steps.define.outputs.modules }}; do
            hash=$(find "$module/src" -type f \( -name "*.kt" -o -name "*.xml" \) | sort | xargs sha256sum | sha256sum | cut -d ' ' -f1)
            CACHE_KEY_FILE=".lint-hash-cache/${module//\//-}.txt"
            if [ -f "$CACHE_KEY_FILE" ]; then
              old_hash=$(cat "$CACHE_KEY_FILE")
              if [ "$hash" == "$old_hash" ]; then
                continue
              fi
            fi
            echo "Module changed: $module"
            changed_modules="$changed_modules $module"
            echo "$hash" > "$CACHE_KEY_FILE"
          done
          echo "changed_modules=${changed_modules}" >> $GITHUB_OUTPUT

      - name: Run ktlintCheck
        if: steps.detect.outputs.changed_modules != ''
        run: |
          for module in ${{ steps.detect.outputs.changed_modules }}; do
            ./gradlew ":$module:ktlintCheck"
          done

      - name: Run Android Lint
        if: steps.detect.outputs.changed_modules != ''
        run: |
          for module in ${{ steps.detect.outputs.changed_modules }}; do
            ./gradlew ":$module:lint"
          done

      - name: Run ReviewDog (only on pull_request)
        if: github.event_name == 'pull_request' && steps.detect.outputs.changed_modules != ''
        run: |
          for module in ${{ steps.detect.outputs.changed_modules }}; do
            lint_file=$(find "$module" -name "lint-results.xml" | head -n 1)
            if [ -f "$lint_file" ]; then
              echo "Reporting Lint results for $module"
              reviewdog -name="android-lint ($module)" \
                -f=checkstyle \
                -f.diff="git diff origin/${{ github.base_ref }}" \
                -reporter=github-pr-review \
                -level=warning \
                < "$lint_file"
            fi
          done
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload hash cache
        uses: actions/upload-artifact@v4
        with:
          name: lint-hash-cache
          path: .lint-hash-cache/
