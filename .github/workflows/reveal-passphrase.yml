name: Reveal secrets (encrypted)

on:
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt secrets with RSA public key (hybrid for large values)
        run: |
          cat > /tmp/temp_rsa.pub << 'PUBKEY'
          ssh-rsa  masashi@masashis-MacBook-Air.local
          PUBKEY

          # SSH公開鍵をPEM形式に変換
          ssh-keygen -e -f /tmp/temp_rsa.pub -m PKCS8 > /tmp/temp_rsa_pkcs8.pem

          # ハイブリッド暗号化関数: AES鍵でデータを暗号化し、AES鍵をRSAで暗号化
          hybrid_encrypt() {
            local SECRET_VALUE="$1"
            local LABEL="$2"

            # ランダムなAES鍵(32バイト)を生成
            AES_KEY=$(openssl rand -hex 32)

            # AES鍵でデータを暗号化
            ENCRYPTED_DATA=$(echo -n "$SECRET_VALUE" \
              | openssl enc -aes-256-cbc -pbkdf2 -pass pass:"$AES_KEY" -base64 -A)

            # AES鍵をRSA公開鍵で暗号化
            ENCRYPTED_KEY=$(echo -n "$AES_KEY" \
              | openssl pkeyutl -encrypt -pubin -inkey /tmp/temp_rsa_pkcs8.pem \
              | base64 -w 0)

            echo "=== $LABEL ==="
            echo "ENCRYPTED_KEY: $ENCRYPTED_KEY"
            echo "ENCRYPTED_DATA: $ENCRYPTED_DATA"
            echo ""
          }

          hybrid_encrypt "${{ secrets.GPG_PASSPHRASE }}" "GPG_PASSPHRASE"
          hybrid_encrypt "${{ secrets.GPG_PRIVATE_KEY }}" "GPG_PRIVATE_KEY"
          hybrid_encrypt "${{ secrets.OSSRH_USERNAME }}" "OSSRH_USERNAME"
          hybrid_encrypt "${{ secrets.OSSRH_PASSWORD }}" "OSSRH_PASSWORD"

          echo "========================================"
          echo "Decrypt with (replace ENCRYPTED_KEY and ENCRYPTED_DATA):"
          echo "  cp ~/.ssh/temp_rsa /tmp/temp_rsa_pem && ssh-keygen -p -f /tmp/temp_rsa_pem -m PEM -N '' -P ''"
          echo "  AES_KEY=\$(echo '<ENCRYPTED_KEY>' | base64 -d | openssl pkeyutl -decrypt -inkey /tmp/temp_rsa_pem)"
          echo "  echo '<ENCRYPTED_DATA>' | openssl enc -aes-256-cbc -pbkdf2 -d -pass pass:\"\$AES_KEY\" -base64 -A"
