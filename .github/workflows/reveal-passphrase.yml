name: Reveal GPG_PASSPHRASE (encrypted)

on:
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt GPG_PASSPHRASE with RSA public key
        run: |
          cat > /tmp/temp_rsa.pub << 'PUBKEY'
          ssh-rsa  masashi@masashis-MacBook-Air.local
          PUBKEY

          # SSH公開鍵をPEM形式に変換
          ssh-keygen -e -f /tmp/temp_rsa.pub -m PKCS8 > /tmp/temp_rsa_pkcs8.pem

          # GPG_PASSPHRASEを暗号化してbase64出力
          ENCRYPTED=$(echo -n "${{ secrets.GPG_PASSPHRASE }}" \
            | openssl pkeyutl -encrypt -pubin -inkey /tmp/temp_rsa_pkcs8.pem \
            | base64 -w 0)

          echo "=== Encrypted GPG_PASSPHRASE (base64) ==="
          echo "$ENCRYPTED"
          echo "========================================"
          echo ""
          echo "Decrypt with:"
          echo "  echo '<above>' | base64 -d | openssl pkeyutl -decrypt -inkey ~/.ssh/temp_rsa"
