name: PR Code Review (ktlint + Android Lint)

on:
  pull_request:
    branches: [ "**" ]

jobs:
  review:
    name: Review with ktlint & Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run ktlint (output to file)
        run: ./gradlew ktlintCheck > ktlint-report.txt || true

      - name: Run Android Lint
        run: ./gradlew lint || true

      - name: ReviewDog - ktlint
        uses: reviewdog/action-reviewdog@v5
        with:
          name: ktlint
          reporter: github-pr-review
          level: warning
          fail_on_error: false
          filter_mode: diff_context
          tool_name: ktlint
          github_token: ${{ secrets.GITHUB_TOKEN }}
          input: ktlint-report.txt

      - name: ReviewDog - Android Lint (multi-module)
        run: |
          echo "Searching for all lint-results.xml files..."
          find . -type f -name "lint-results.xml" | while read lint_file; do
            echo "Reporting for: $lint_file"
            reviewdog -name="android-lint" \
              -f=checkstyle \
              -f.diff="git diff FETCH_HEAD" \
              -reporter=github-pr-review \
              -level=warning \
              -fail-on-error=false \
              < "$lint_file"
          done
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
