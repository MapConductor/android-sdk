[versions]
openmobilemaps = "4.0.0"
agp = "9.2.1"

core = "1.7.0"
kotlin = "2.4.10"

coreKtx = "1.16.0"
appcompat = "1.7.1"

junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
lifecycleViewmodelCompose = "2.8.7"

# https://developer.android.com/develop/ui/compose/bom/bom-mapping

composeBom = "2025.02.00"
okhttp = "5.3.2"
runner = "1.7.0"

mapboxAndroid = "11.28.0"
tomtomMaps = "2.4.2"
playServicesMaps = "20.0.0"

arcgisMapsKotlin = "300.1.0"
vectordrawable = "1.2.0"
ktLint = "14.2.0"
mapLibreSdk = "13.4.1"
mapLibreAnnotation = "3.0.2"
maptilerSdk = "2.1.0"
longdoSdk = "1.3.0"
mapplsSdk = "9.0.3"
materialVersion = "1.14.0"
coroutines = "1.9.0"
ui = "1.11.4"

[libraries]
# Open Mobile Maps (https://github.com/openmobilemaps/maps-core) — MPL 2.0
openmobilemaps-mapscore = { module = "io.openmobilemaps:mapscore", version.ref = "openmobilemaps" }
# Android ??
androidx-core = { module = "androidx.test:core", version.ref = "core" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Lifecycle / Activity Compose
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-common-java8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }

# Jetpack Compose?with BOM?
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

mapconductor-core = { module = "com.mapconductor:core" }
mapconductor-icons = { module = "com.mapconductor:icons" }
mapconductor-googlemaps = { module = "com.mapconductor:for-googlemaps" }
mapconductor-mapbox = { module = "com.mapconductor:for-mapbox" }
mapconductor-here = { module = "com.mapconductor:for-here" }
mapconductor-arcgis = { module = "com.mapconductor:for-arcgis" }
mapconductor-maplibre = { module = "com.mapconductor:for-maplibre" }
mapconductor-maptiler = { module = "com.mapconductor:for-maptiler" }
mapconductor-longdo = { module = "com.mapconductor:for-longdo" }
mapconductor-marker-strategy = { module = "com.mapconductor:marker-strategy" }
mapconductor-marker-native-strategy = { module = "com.mapconductor:marker-native-strategy" }
mapconductor-marker-clustering = { module = "com.mapconductor:marker-clustering" }
mapconductor-geojson = { module = "com.mapconductor:geojson" }
mapconductor-kml = { module = "com.mapconductor:kml" }

# Mapbox
mapbox-android = { module = "com.mapbox.maps:android-ndk27", version.ref = "mapboxAndroid" }
tomtom-map-display = { module = "com.tomtom.sdk.maps:map-display-standard", version.ref = "tomtomMaps" }

# MapLibre
maplibre-sdk = { module = "org.maplibre.gl:android-sdk", version.ref = "mapLibreSdk" }
maplibre-annotation = { module = "org.maplibre.gl:android-plugin-annotation-v9", version.ref = "mapLibreAnnotation"}

# MapTiler
maptiler-sdk = { module = "com.maptiler:maptiler-sdk-kotlin", version.ref = "maptilerSdk" }

# Longdo Map API3
longdo-sdk = { module = "com.longdo.map:sdk3", version.ref = "longdoSdk" }

# Mappls (MapmyIndia)
mappls-sdk = { module = "com.mappls.sdk:mappls-android-sdk", version.ref = "mapplsSdk" }

# Google Maps
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }

# ArcGIS
arcgis-maps-kotlin = { group = "com.esri", name = "arcgis-maps-kotlin", version.ref = "arcgisMapsKotlin" }
arcgis-maps-kotlin-toolkit-bom = { group = "com.esri", name = "arcgis-maps-kotlin-toolkit-bom", version.ref = "arcgisMapsKotlin" }
arcgis-maps-kotlin-toolkit-geoview-compose = { group = "com.esri", name = "arcgis-maps-kotlin-toolkit-geoview-compose" }
arcgis-maps-kotlin-toolkit-authentication = { group = "com.esri", name = "arcgis-maps-kotlin-toolkit-authentication" }


# ????
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-vectordrawable = { group = "androidx.vectordrawable", name = "vectordrawable", version.ref = "vectordrawable" }

androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-runtime = { group = "androidx.compose.runtime", name = "runtime" }
material = { group = "com.google.android.material", name = "material", version.ref = "materialVersion" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-unit = { group = "androidx.compose.ui", name = "ui-unit" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
jlleitschuh-ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktLint"}
